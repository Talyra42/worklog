<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Worklog —— 一个把工时存在云端的小工具：一键打卡、月历热力图、多设备实时同步。"
    />
    <link rel="canonical" href="https://worklog.talyra42.top/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://worklog.talyra42.top/" />
    <meta property="og:title" content="Worklog · 工时记录" />
    <meta
      property="og:description"
      content="把工时存在云端的小工具：一键打卡、月历热力图、多设备实时同步。"
    />
    <meta name="theme-color" content="#eef4fb" />
    <title>Worklog · 工时记录</title>
    <script>
      ;(() => {
        let mode = null
        try {
          mode = localStorage.getItem('worklog.themeMode')
        } catch {
          /* ignore */
        }
        const theme =
          mode === 'light' || mode === 'dark'
            ? mode
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#0a0f16' : '#eef4fb')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
