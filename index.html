<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Worklog —— 一个只保存在本机的工时记录小工具。" />
    <meta name="theme-color" content="#f2efe9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)" />
    <title>Worklog · 工时记录</title>
    <script>
      ;(() => {
        let theme = null
        try {
          const raw = localStorage.getItem('worklog.store.v1')
          if (raw) theme = JSON.parse(raw).state.theme
        } catch {
          /* ignore */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
