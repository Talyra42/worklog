<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Worklog —— 一个把工时存在云端的小工具：一键打卡、月历热力图、多设备实时同步。"
    />
    <link rel="canonical" href="https://worklog.talyra42.top/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://worklog.talyra42.top/" />
    <meta property="og:title" content="Worklog · 工时记录" />
    <meta
      property="og:description"
      content="把工时存在云端的小工具：一键打卡、月历热力图、多设备实时同步。"
    />
    <meta name="theme-color" content="#f2efe9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)" />
    <title>Worklog · 工时记录</title>
    <script>
      ;(() => {
        let theme = null
        try {
          const stored = localStorage.getItem('worklog.theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch {
          /* ignore */
        }
        if (!theme) {
          try {
            const legacy = JSON.parse(localStorage.getItem('worklog.store.v1') || 'null')
            if (legacy?.state?.theme === 'light' || legacy?.state?.theme === 'dark') {
              theme = legacy.state.theme
            }
          } catch {
            /* ignore */
          }
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
